name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aieng-ui/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aieng-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Typecheck + build
        run: npm run build

  backend:
    name: Backend (focused tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aieng-ui/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aieng-ui/backend/pyproject.toml

      - name: Install backend (with dev extras)
        # Installs the full backend incl. build123d/OCP so the CAD-generation
        # tests can run; pytest + httpx come from the [dev] extra.
        # The backend depends on the sibling `aieng-format` core (the aieng/
        # package), which is not published to PyPI — install it editable from
        # the repo first so the dependency resolves locally instead of failing.
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../aieng
          pip install -e .[dev]

      - name: Version surface anti-drift
        run: python ../../scripts/update_version_surface.py --check

      - name: Backend test suite
        # The WHOLE suite, deliberately. This job used to run a hand-picked list
        # of files and -k expressions, which meant every NEW test file was
        # invisible to CI until someone remembered to add it — that is exactly
        # how a doc-contract regression in tests/test_agent_guides.py shipped
        # through a green PR. An allowlist that has to be maintained is a
        # guarantee of future gaps; running everything needs no maintenance.
        #
        # Solver/mesh tests skip themselves when Gmsh/CalculiX are absent, so
        # this stays honest on a runner without them.
        run: pytest tests -q

      - name: aieng core library suite
        # The `.aieng` format/schema/validation library — the thing every
        # package on disk depends on — previously had ONE file in CI
        # (test_benchmarks_analytical_fea.py) out of ~3000 tests. Same
        # allowlist trap as the backend job: cheap to run whole (~2 min), so
        # run it whole.
        run: cd ../../aieng && pytest tests -q

  vscode-extension:
    name: VS Code extension (test + package + smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: aieng-vscode-extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aieng-vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run vsix

      - name: Smoke test VSIX contents
        run: npm run smoke

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aieng-vscode-extension-vsix
          path: aieng-vscode-extension/*.vsix
          if-no-files-found: error

  docs:
    name: Docs / agent onboarding anti-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check agent docs alignment
        run: python scripts/check_agent_docs.py
